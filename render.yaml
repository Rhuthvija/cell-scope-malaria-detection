services:
  - type: web
    name: cell-scope
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker keeps memory under the free tier's 512 MB; long timeout because
    # TensorFlow + model warm-up takes a while when the worker boots.
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: CELLSCOPE_ENCRYPTION_KEY
        sync: false          # set the real key in the Render dashboard, never in git
      - key: CELLSCOPE_DEMO_DATA
        value: "1"
      - key: CELLSCOPE_SECRET_KEY
        generateValue: true  # signs login sessions
